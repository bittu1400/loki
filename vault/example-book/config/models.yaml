# Model routing only (OQ-03). Pipeline behaviour lives in pipeline.yaml.
#
# Verification status (2026-08-25, live generation probes — see OQ-02/OQ-04):
# - gemini: 2.5 family CLOSED to new keys (404). Working: gemini-3.5-flash-lite
#   (7s, 781 words). gemini-3.7-flash: persistent 503 high-demand.
# - openrouter: inkling:free = 403 (agentic-only). glm-5.2:free = upstream
#   429 twice, unreliable. minimax-m3:free WORKS (16s, 925 words — best of
#   spike). Limits: 20 RPM / 50 RPD; author cannot buy the $10 credit tier.
# - groq: gpt-oss-120b works (5s) but prose quality weakest of four tested.

pov_models:
  ovist-rhoam:
    provider: openrouter
    model: minimax/minimax-m3:free # spike winner 2026-08-25
  brannec-tull:
    provider: gemini
    model: gemini-3.5-flash-lite # verified generating 2026-08-25

fallback_chain:
  - provider: groq
    model: openai/gpt-oss-120b # verified generating 2026-08-25; prose weakest
  - provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free # generates OK; canon-drifts

editor_model:
  # gemini-2.5-pro is dead for new keys. Structured-output-capable free
  # options are scarce; glm-5.2 advertises structured_outputs but was
  # saturated during testing. Re-verify before Phase 5.
  primary: { provider: openrouter, model: z-ai/glm-5.2:free }
  fallback: { provider: openrouter, model: dots-studio/dots-3-note-preview:free }

generation_params:
  temperature: 0.9
  top_p: 0.95
  seed: 20260825 # pinned where the provider supports it; ignored otherwise
