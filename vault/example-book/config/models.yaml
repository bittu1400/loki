# Model routing only (OQ-03). Pipeline behaviour lives in pipeline.yaml.
#
# FINAL ROUTING — settled 2026-08-25 after two spike rounds + JSON probes.
# Every role has its fallback on a DIFFERENT provider. Dismissed this round:
# cerebras (402 paywall), github models (retired), cohere (thinking overhead,
# 3x overshoot), z.ai (flash-only tier, overloaded), glm-5.2:free on
# openrouter (upstream-saturated twice), inkling:free (API-blocked),
# nemotron-3-ultra (canon-breaking), gpt-oss-120b as drafter (weakest prose;
# kept only as last-resort fallback).

pov_models:
  # ovist-rhoam chapters are voice-critical: procedural diction, counting habit.
  ovist-rhoam:
    provider: openrouter
    model: minimax/minimax-m3:free # spike winner: best voice + length adherence
  # brannec-tull chapters are terse action; flash-lite suits the register and
  # diversifies the provider so consecutive chapters never share one quota.
  brannec-tull:
    provider: gemini
    model: gemini-3.5-flash-lite # 7s latency; add explicit word-target instruction

fallback_chain: # applies when a pov_model's provider fails or is rate-limited
  - provider: nvidia
    model: minimaxai/minimax-m3 # same model, independent quota (key expires ~2027-02, see .env)
  - provider: groq
    model: openai/gpt-oss-120b # fastest; weakest prose
  - provider: local
    model: gemma-4-12b-it # llama.cpp on localhost:8080; ADR-0006. Last resort by
    # position, not by quality: it passed every style threshold in the 2026-08-31
    # spike. It is last because that evidence is one prompt and one seed, and
    # because it is the only lane that dies when a laptop is asleep.
# aihubmix REMOVED 2026-08-25: its free tier caps unrecharged accounts at
# ~10 lifetime requests, then returns an abuse-warning string. Failed the
# stability condition (open-questions.md OQ-04 re-run; decisions.md #12).

editor_model:
  # ROUTING HISTORY, both same day, both on the ch-005 case:
  #   #28 put mistral-medium first because flash-lite missed the "nine vs two"
  #       contradiction twice.
  #   #31 put flash-lite back, because the deterministic number check (#30) now
  #       hands the disagreement to whichever model answers, and flash-lite
  #       caught it on both runs with the finding in its prompt — at 476 output
  #       tokens against mistral's 1091, and proposing 1 new locked fact against
  #       mistral's 8-9 (set dressing included).
  # Mistral stays second: it is the only model that has caught a contradiction
  # UNAIDED, which is exactly what a fallback should be good at.
  primary: { provider: gemini, model: gemini-3.5-flash-lite } # valid JSON w/ responseMimeType
  fallback: { provider: mistral, model: mistral-medium-latest } # valid JSON w/ json_object
# mistral-large-latest REMOVED 2026-09-01: 403 'This model is not available in
# your subscription tier' (code 1910) on the key that verified it in Session 4.
# It is still LISTED by /v1/models — the catalog is not the entitlement.

generation_params:
  temperature: 0.9
  top_p: 0.95
  seed: 20260825 # pinned where the provider supports it; ignored otherwise
