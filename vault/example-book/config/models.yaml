# Model routing only (OQ-03). Pipeline behaviour lives in pipeline.yaml.
#
# Verification status (2026-08-25, second round — live generation probes):
# - minimax-m3 confirmed on TWO providers: openrouter AND nvidia (stable
#   fallback lane; same model, independent quotas).
# - mistral free tier verified: small + large both generate (~1B tok/mo).
#   Large resolves scenes early (347 words vs 1000 target) when drafting.
# - cohere command-a-plus works only with thinking disabled; 3x overshoot.
# - cerebras: 402 payment required despite "free" listing. Dead for us.
# - github models: fully retired 2026-07-30. Never add it.
# - z.ai: flash tier free but overloaded during testing; glm-5.x needs balance.

pov_models:
  ovist-rhoam:
    provider: openrouter
    model: minimax/minimax-m3:free # spike winner 2026-08-25
  brannec-tull:
    provider: gemini
    model: gemini-3.5-flash-lite # verified generating 2026-08-25

fallback_chain:
  # Same model, different provider — survives OpenRouter pulling the :free slug.
  - provider: nvidia
    model: minimaxai/minimax-m3 # verified generating 2026-08-25
  - provider: groq
    model: openai/gpt-oss-120b # verified generating 2026-08-25; prose weakest
  - provider: mistral
    model: mistral-large-latest # verified generating 2026-08-25; undershoots length

editor_model:
  primary: { provider: mistral, model: mistral-large-latest } # structured output support to be tested in Phase 2
  fallback: { provider: openrouter, model: dots-studio/dots-3-note-preview:free }

generation_params:
  temperature: 0.9
  top_p: 0.95
  seed: 20260825 # pinned where the provider supports it; ignored otherwise
